<style>
/* VOICE: painel de trabalho, claro e direto, cada número com sua regra visível

:root{color-scheme:light dark;

--warn:light-dark(#fff4d6,#3a2f10);--warnink:light-dark(#7a5600,#f2cf73)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Nunito Sans",system-ui,sans-serif;overflow-x:clip}

.t-lost{background:light-dark(#fbe6e6,#3d1d1d);color:var(--red)}
.tl{list-style:none;padding:0;margin:6px 0 0;display:grid;gap:4px;font-size:13px}
.tl li{padding-left:16px;position:relative}
.tl li::before{content:"";position:absolute;left:2px;top:7px;width:7px;height:7px;border-radius:50%;background:var(--blue)}
.cfg input[type=number],.cfg input[type=text],.cfg select{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:4px 8px;font-size:16px;width:100%;max-width:240px}
.cfg input[type=number]{max-width:110px;text-align:right}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:10px;flex-wrap:wrap}
.btn{min-height:40px;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:6px 14px;font-weight:700}
.btn.pr{background:var(--blue);border-color:var(--blue);color:#fff}

.search{min-height:40px;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:6px 12px;font-size:16px;width:min(320px,100%)}
#tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);padding:8px 10px;border-radius:9px;font-size:12.5px;z-index:60;max-width:260px;opacity:0;transition:opacity .1s}
#tip b{display:block;margin-bottom:2px}
.flow{display:grid;gap:10px}
.fl{display:grid;grid-template-columns:minmax(0,210px) minmax(0,1fr) 70px;gap:10px;align-items:center;font-size:13.5px}
.fl .n{text-align:right;font-weight:800}
@media(max-width:600px){.fl{grid-template-columns:minmax(0,1fr) 60px}.fl .track{grid-column:1/-1;order:3}.row{grid-template-columns:minmax(0,1fr) auto}.row .track{grid-column:1/-1;order:3}}
.foot{font-size:12.5px;color:var(--mut);margin-top:22px}
@media(max-width:600px){table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:9em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:8.5em;margin-inline-start:-9em;white-space:normal;color:var(--mut);font-size:12px}.stack td:empty{display:none}}
@media(prefers-reduced-motion:reduce){.card{transition:none}}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;const t=c.closest('table');c.dataset.l=t&&t.rows[0]&&t.rows[0].cells[i]?t.rows[0].cells[i].textContent:''}}).observe(document,{childList:true,subtree:true})</script>

<script>
{
/* ================= utilidades ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf=new Intl.NumberFormat('pt-BR'),nf1=new Intl.NumberFormat('pt-BR',{maximumFractionDigits:1,minimumFractionDigits:1});
const brl0=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});
const brl2=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',minimumFractionDigits:2,maximumFractionDigits:2});
const N=v=>v==null?'—':nf.format(Math.round(v));
const PC=v=>v==null||!isFinite(v)?'—':nf1.format(v*100)+'%';
const R=v=>v==null||!isFinite(v)?null:(Math.abs(v)<1000?brl2:brl0).format(v);
const RT=v=>R(v)||'—';

const median=a=>{if(!a.length)return null;const s=[...a].sort((x,y)=>x-y),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2};
const DAY=864e5;
const MES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const MESC=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const p2=n=>String(n).padStart(2,'0');
const fD=t=>{const d=new Date(t);return p2(d.getUTCDate())+'/'+p2(d.getUTCMonth()+1)+'/'+d.getUTCFullYear()};
const fDs=t=>{const d=new Date(t);return p2(d.getUTCDate())+'/'+p2(d.getUTCMonth()+1)};
const fDT=t=>fD(t)+' '+p2(new Date(t).getUTCHours())+':'+p2(new Date(t).getUTCMinutes());
const ym=t=>{const d=new Date(t);return d.getUTCFullYear()+'-'+p2(d.getUTCMonth()+1)};
const sod=t=>{const d=new Date(t);return Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate())};
const som=t=>{const d=new Date(t);return Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),1)};
const addM=(t,k)=>{const d=new Date(t);return Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+k,1)};
const iso=t=>{const d=new Date(t);return d.getUTCFullYear()+'-'+p2(d.getUTCMonth()+1)+'-'+p2(d.getUTCDate())};
const fromIso=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');return m?Date.UTC(+m[1],+m[2]-1,+m[3]):null};

/* ================= dados do RD CRM ================= */
const OFF=3*3600e3;const L=s=>s*1000-OFF;
let NOW=Date.now()-OFF,HIST=NOW,GEN=null,META=null,STATUS=null,DICT={src:[],camp:[],user:[],reason:[],city:[],utm:[]};
const MARCAS={pd:'Plano Digna',pp:'Parque da Paz',ou:'Outras operações'};
const GRUPOS={entrada:'Entrada',abordagem:'Abordagem',qualificacao:'Qualificação',proposta:'Proposta',negociacao:'Negociação',propria:'Etapa própria'};
const cleanMot=raw=>{if(raw==null||!String(raw).trim())return null;let s=String(raw).trim().replace(/\s+/g,' ');
 const fix={'Ã§':'ç','Ã¡':'á','Ãª':'ê','Ã£':'ã','Ã©':'é','Ã³':'ó','Ãº':'ú','Ã­':'í','Ã¢':'â','Ãµ':'õ','Ã‡':'Ç','Ã‰':'É','Ã´':'ô','Ã ':'à'};for(const k in fix)s=s.split(k).join(fix[k]);
 s=s.toLowerCase();return s.charAt(0).toUpperCase()+s.slice(1)};
const guessM=n=>/parque|jazig|cremat|cemit|ppaz/i.test(n)?'pp':/plano|wi-?fi|digna/i.test(n)?'pd':'ou';
const normO=v=>{if(v==null)return 'Não informada';v=String(v).replace(/\s+/g,' ').trim();if(!v||/^desconhecid/i.test(v))return 'Não informada';return v.split('|').map(x=>{x=x.trim();return x.charAt(0).toUpperCase()+x.slice(1)}).join(' | ')};
const guessEq=n=>/qualif|visita/i.test(n)?'qualificacao':/propost|apresent|or[cç]amento/i.test(n)?'proposta':/negocia|fechament/i.test(n)?'negociacao':/contato|abord|tentativa|conect|liga[cç]/i.test(n)?'abordagem':/entrada|novo|lead|inicial|base/i.test(n)?'entrada':'propria';
let FUN=[],FI={},D=[],CI={},MOTRAW={},LISTS={};const CONT_DEALS=new Map();
let cfg={qual:{},eq:{},marca:{},metas:{},orc:{},mbrand:{},metaGeral:{},mfunil:{},mcamp:{},vendas:[],vendasDel:[]};let CFG_SRC='padrão';
function loadData(bi){META=bi.meta;GEN=L(META.generated_at);HIST=L(META.track_start);DICT=bi.dict;
 FUN=bi.pipelines.map(p=>({id:p.id,n:p.name,st:p.stages.map(s=>s.name),m:'pd'}));FI=Object.fromEntries(FUN.map(f=>[f.id,f]));
 CI=Object.fromEntries(DICT.camp.map((n,i)=>[String(i),{n}]));
 const dv=(k,i)=>i>=0?DICT[k][i]:null;
 D=bi.deals.map(r=>{const [id,pi,si,st,c,cl,src,camp,user,reason,ck,city,utm,amt]=r;const f=bi.pipelines[pi];
  const d={id,cf:f.id,cs:Math.max(0,si),st:st==='w'?'won':st==='l'?'lost':'open',hold:st==='p',c:L(c),ca:cl?L(cl):null,o:normO(dv('src',src)),cp:camp>=0?String(camp):null,ow:dv('user',user)||'Sem responsável',pr:dv('city',city)||'Não informada',utm:dv('utm',utm),mr:dv('reason',reason),cid:ck||('n'+id),am:amt,mo:null,lf:null,ls:null};
  if(d.st!=='open'&&d.ca==null)d.ca=d.c;
  if(d.st==='lost'){d.mo=cleanMot(d.mr);d.lf=d.cf;d.ls=d.cs;if(d.mr!=null)MOTRAW[d.mr]=(MOTRAW[d.mr]||0)+1}
  const hv=bi.hist[id];let h=hv&&hv.length?hv.filter(e=>e[0]>=0&&e[1]>=0).map(e=>({f:bi.pipelines[e[0]].id,s:e[1],t:e[2]?L(e[2]):d.c})):null;
  d.hh=!!(h&&h.length)&&d.c>=HIST;
  if(!h||!h.length)h=[{f:d.cf,s:d.cs,t:d.c}];
  const last=h[h.length-1];if(last.f!==d.cf||last.s!==d.cs)h.push({f:d.cf,s:d.cs,t:Math.max(last.t,d.c)});
  for(let i=1;i<h.length;i++)if(h[i].f!==h[i-1].f)h[i].tr=1;
  d.h=h;d.fs=[...new Set(h.map(e=>e.f))];d.ef=h[0].f;return d});
 CONT_DEALS.clear();for(const d of D){if(!CONT_DEALS.has(d.cid))CONT_DEALS.set(d.cid,[]);CONT_DEALS.get(d.cid).push(d)}
 const cnt=k=>{const m={};for(const d of D)m[d[k]]=(m[d[k]]||0)+1;return Object.keys(m).sort((a,b)=>m[b]-m[a])};
 LISTS={owner:cnt('ow').sort(),origem:cnt('o'),praca:cnt('pr'),motivo:[...new Set(D.filter(d=>d.st==='lost').map(d=>d.mo||'Motivo não informado'))].sort()}}

/* ================= eventos das telas ================= */
main.addEventListener('click',ev=>{const t=ev.target;
 if(t.closest('a[href^="https://"]'))return;
 const dr=t.closest('[data-drill]');if(dr){S.drill=dr.dataset.drill;S.dpage=0;S.open=null;location.hash='detalhamento';return}
 const d2=t.closest('[data-drill2]');if(d2){S.drill=d2.dataset.drill2;S.dpage=0;S.open=null;renderView();return}
 const gr=t.closest('[data-gran]');if(gr){S.gran=gr.dataset.gran;renderView();return}
 const ff=t.closest('[data-ff]');if(ff){S.ff=ff.dataset.ff;renderView();return}
 const mcp=t.closest('[data-mcamp]');if(mcp){const id=mcp.dataset.mcamp,v=mcp.dataset.mset;if(v)cfg.mcamp[id]=v;else delete cfg.mcamp[id];edited();SELC=null;renderView();return}
 const mal=t.closest('[data-mall]');if(mal){S.mall=mal.dataset.mall==='1';renderView();return}
 const mac=t.closest('[data-macc]');if(mac){const id=mac.dataset.macc;if(id==='all')S.macc.clear();else if(S.macc.has(id))S.macc.delete(id);else S.macc.add(id);renderView();return}
 const ml=t.closest('[data-mlev]');if(ml){S.mlev=ml.dataset.mlev;if(S.mlev==='campaign'){S.mpc=null;S.mps=null}renderView();return}
 if(t.closest('[data-mclear]')){S.mpc=S.mps=null;S.mlev='campaign';renderView();return}
 const md2=t.closest('[data-mdrill]');if(md2){if(S.mlev==='campaign'){S.mpc=md2.dataset.mdrill;S.mpcn=md2.dataset.mname;S.mlev='adset'}else if(S.mlev==='adset'){S.mps=md2.dataset.mdrill;S.mpsn=md2.dataset.mname;S.mlev='ad'}renderView();return}
 const tp=t.closest('[data-tp]');if(tp){S.tp=tp.dataset.tp;renderView();return}
 const so=t.closest('[data-sort]');if(so){const k=so.dataset.sort;S.dsort={k,d:S.dsort.k===k?-S.dsort.d:-1};renderView();return}
 const op=t.closest('[data-open]');if(op){S.open=S.open===op.dataset.open?null:op.dataset.open;renderView();return}
 if(t.id==='pp'){S.dpage--;S.open=null;renderView();return}if(t.id==='pn'){S.dpage++;S.open=null;renderView();return}
 if(t.id==='csv'){const rows=VIEWS._rows||[];const H=['id_negocio','link_rd','marca','funil_atual','etapa_atual','status','criado_em','qualificado_em','fechado_em','origem','campanha','responsavel','motivo_perda','praca'];
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';const txt=[H.join(';')].concat(rows.map(d=>[d.id,'https://crm.rdstation.com/app/deals/'+d.id,MARCAS[d.m],FI[d.cf].n,FI[d.cf].st[d.cs],STL[d.st],iso(d.c),d.qa?iso(d.qa):'',d.ca?iso(d.ca):'',d.o,d.cp?CI[d.cp].n:'',d.ow,d.st==='lost'?(d.mo||'Motivo não informado'):'',d.pr].map(q).join(';'))).join('\n');
  copy(txt,$('#csvmsg'),' CSV copiado: '+rows.length+' linhas, separado por ponto e vírgula.');return}
 if(t.id==='vm-add'){const d=$('#vm-d').value,f=$('#vm-f').value,n=Math.round(+$('#vm-n').value||0),o=$('#vm-o').value,obs=$('#vm-obs').value.trim().slice(0,80);
  if(!fromIso(d)||!n||n<1){$('#vm-n').focus();return}cfg.vendas=(cfg.vendas||[]).concat([{id:'v'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),d,f,n,o,obs}]);edited();SELC=null;renderView();return}
 const vd=t.closest('[data-vmdel]');if(vd){const id=vd.dataset.vmdel;cfg.vendas=(cfg.vendas||[]).filter(v=>v.id!==id);cfg.vendasDel=[...new Set([...(cfg.vendasDel||[]),id])];edited();SELC=null;renderView();return}
 if(t.id==='cfgcopy'){copy(JSON.stringify(cfg,null,2),$('#cfgmsg'),' Copiado. Cole no arquivo config.json do repositório e salve.');return}
 if(t.id==='reset'){try{localStorage.removeItem('bi-digna-cfg-v2')}catch(e){}cfg=JSON.parse(JSON.stringify(REPO_CFG||{qual:{},eq:{},marca:{},metas:{},orc:{}}));for(const k of ['qual','eq','marca','metas','orc','mbrand','metaGeral','mfunil','mcamp'])cfg[k]=cfg[k]||{};cfg.vendas=cfg.vendas||[];cfg.vendasDel=cfg.vendasDel||[];CFG_SRC='config.json publicado';defaults();applyBrand();deriveQ();refresh();return}});
function copy(txt,msg,ok){try{navigator.clipboard.writeText(txt).then(()=>{msg.textContent=ok},()=>{msg.textContent=' O navegador bloqueou a cópia.'})}catch(e){msg.textContent=' O navegador bloqueou a cópia.'}}
let dqT=null;
main.addEventListener('input',ev=>{const t=ev.target;if(t.id==='dq'){clearTimeout(dqT);dqT=setTimeout(()=>{S.dq=t.value;S.dpage=0;renderView();const n=$('#dq');if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length)}},250)}});
const edited=()=>{CFG_SRC='editada neste navegador';saveCfg()};
main.addEventListener('change',ev=>{const t=ev.target;
 if(t.id==='distP'){S.distP=t.checked;renderView();return}
 if(t.id==='cfgM'){S.cfgM=t.value;renderView();return}
 if(t.dataset.meta){const [f,k]=t.dataset.meta.split('|');const key=f+'|'+S.cfgM;cfg.metas[key]=Object.assign({},cfg.metas[key]||{},{[k]:Math.max(0,+t.value||0)});edited();return}
 if(t.dataset.mgeral){const v=Math.max(0,+t.value||0);if(v)cfg.metaGeral[S.cfgM]=v;else delete cfg.metaGeral[S.cfgM];edited();return}
 if(t.dataset.orc){cfg.orc[t.dataset.orc+'|'+S.cfgM]=Math.max(0,+t.value||0);edited();return}
 if(t.dataset.qual){cfg.qual[t.dataset.qual]=+t.value;edited();deriveQ();SELC=null;return}
 if(t.dataset.marca){cfg.marca[t.dataset.marca]=t.value;edited();applyBrand();SELC=null;renderTop();renderView();return}
 if(t.dataset.mfunil!=null){cfg.mfunil[t.dataset.mfunil]=t.value;edited();SELC=null;return}
 if(t.dataset.eq){const [f,i]=t.dataset.eq.split('|');cfg.eq[f]=(cfg.eq[f]||[]).slice();cfg.eq[f][+i]=t.value;edited();return}});

function route(){const h=location.hash.slice(1);S.tab=TABS.some(x=>x[0]===h)?h:'visao-geral';closePop();renderTop();renderView()}
let REPO_CFG=null;
async function boot(){main.innerHTML='<p class="mut" style="padding:40px 0">Carregando dados do RD CRM…</p>';
 const getJ=async u=>{try{const r=await fetch(u,{cache:'no-store'});return r.ok?await r.json():null}catch(e){return null}};
 const [bi,st,rc,ma,mst]=await Promise.all([getJ('data/bi.json'),getJ('data/status.json'),getJ('config.json'),getJ('data/meta.json'),getJ('data/meta-status.json')]);STATUS=st;REPO_CFG=rc;MA=ma&&ma.accounts&&Object.keys(ma.accounts).length?ma.accounts:null;MST=mst;
 if(!bi||!bi.deals){$('#filters').innerHTML='';$('#tabs').innerHTML='';$('#fresh').innerHTML='';
  main.innerHTML=head('Aguardando a primeira sincronização com o RD CRM',(st&&st.ok===false?'A última tentativa falhou: '+esc(st.message||'erro desconhecido')+'. ':'')+'Configure o segredo RD_CRM_TOKEN no repositório e rode a ação "Sincronizar RD CRM" em Actions. O passo a passo está no README.');return}
 loadData(bi);MIND=sod(Math.min(...D.map(d=>d.c).slice(0,1),D.reduce((m,d)=>Math.min(m,d.c),Infinity)));
 let loc=null;try{loc=JSON.parse(localStorage.getItem('bi-digna-cfg-v2')||'null')}catch(e){}
 const base=loc||rc;if(base)for(const k of ['qual','eq','marca','metas','orc','mbrand'])cfg[k]=Object.assign({},base[k]||{});cfg.metaGeral=Object.assign({},rc&&rc.metaGeral||{},loc&&loc.metaGeral||{});cfg.metas=Object.assign({},rc&&rc.metas||{},loc&&loc.metas||{});cfg.mfunil=Object.assign({},rc&&rc.mfunil||{},loc&&loc.mfunil||{});cfg.mcamp=Object.assign({},rc&&rc.mcamp||{},loc&&loc.mcamp||{});{const byId=new Map();for(const v of [...(rc&&rc.vendas||[]),...(loc&&loc.vendas||[])])if(v&&v.id)byId.set(v.id,v);cfg.vendas=[...byId.values()];cfg.vendasDel=[...new Set([...(rc&&rc.vendasDel||[]),...(loc&&loc.vendasDel||[])])]}CFG_SRC=loc?'editada neste navegador':rc?'config.json publicado':'padrão sugerido pelo nome das etapas';
 defaults();applyBrand();deriveQ();
 addEventListener('hashchange',()=>{route();window.scrollTo(0,0)});route();
 setInterval(()=>{NOW=Date.now()-OFF},60e3)}
boot();
}
</script>
<p class="foot" style="padding:0 max(3vw,14px) 24px;max-width:1440px;margin:0 auto">Dados do RD Station CRM sincronizados de hora em hora. O painel não guarda nome, e-mail nem telefone de contatos: pessoas são contadas por um código irreversível.</p>
