name: Sincronizar Meta Ads

on:
  schedule:
    - cron: '13 * * * *'   # reserva: reinicia a corrente se ela parar
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/sync-meta.mjs'
      - '.github/workflows/sync-meta.yml'

permissions:
  contents: write
  actions: write   # para a rodada agendar a próxima


jobs:
  sync:
    runs-on: ubuntu-latest
    concurrency:
      group: meta-sync   # uma coleta por vez; a espera da corrente fica fora da fila
      cancel-in-progress: false
    timeout-minutes: 80
    env:
      # Contas permitidas: o script recusa qualquer conta fora desta lista
      META_AD_ACCOUNTS: '3510334829185729,1555697961629633,3751650091518694,1939722613078564,1444452782074905,2000431566857709,311468502055498,195768907609096'
      META_API_VERSION: ${{ vars.META_API_VERSION || 'v26.0' }}
      META_START: ${{ vars.META_START || '2025-01-01' }}
      META_REPROCESS_DAYS: '7'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Buscar dados no Meta Ads
        run: node scripts/sync-meta.mjs
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      - name: Publicar dados
        if: always()
        run: |
          git config user.name "bi-digna-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && { echo "Sem mudanças nos dados"; exit 0; }
          git commit -m "Sincroniza Meta Ads $(date -u +%Y-%m-%dT%H:%MZ)"
          if ! git pull --rebase origin main; then
            git rebase --abort || true
            echo "::error::Outra sincronização gravou dados ao mesmo tempo. Nada foi perdido; a próxima rodada atualiza normalmente."
            exit 1
          fi
          git push origin HEAD:main

  agendar:
    # Corrente que não depende do agendador do GitHub: espera 1 hora desde o início
    # desta rodada e dispara a próxima, a menos que já exista uma rodada mais nova.
    # Para pausar, crie a variável META_AUTOLOOP=off.
    needs: sync
    if: always() && vars.META_AUTOLOOP != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Esperar e agendar a próxima rodada
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          START=$(date -d "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/${{ github.run_id }} --jq .created_at)" +%s)
          WAIT=$(( 3600 - ($(date +%s) - START) ))
          if [ "$WAIT" -gt 0 ]; then sleep "$WAIT"; fi
          ME=$(gh api repos/$GITHUB_REPOSITORY/actions/runs/${{ github.run_id }} --jq .created_at)
          NEWER=$(gh run list -R "$GITHUB_REPOSITORY" -w sync-meta.yml -L 20 --json createdAt --jq "[.[] | select(.createdAt > \"$ME\")] | length")
          if [ "$NEWER" = "0" ]; then
            gh workflow run sync-meta.yml -R "$GITHUB_REPOSITORY" --ref main
            echo "Próxima rodada agendada."
          else
            echo "Já existe uma rodada mais nova; esta corrente termina aqui."
          fi
