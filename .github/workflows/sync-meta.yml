name: Sincronizar Meta Ads

on:
  schedule:
    - cron: '13,33,53 * * * *'   # três tentativas por hora (o agendador do GitHub atrasa ou pula rodadas)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/sync-meta.mjs'
      - '.github/workflows/sync-meta.yml'

permissions:
  contents: write
  actions: write   # para a rodada agendar a próxima

concurrency:
  group: sync-meta
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      # Contas permitidas: o script recusa qualquer conta fora desta lista
      META_AD_ACCOUNTS: '3510334829185729,1555697961629633,3751650091518694,1939722613078564,1444452782074905,2000431566857709,311468502055498,195768907609096'
      META_API_VERSION: ${{ vars.META_API_VERSION || 'v26.0' }}
      META_START: ${{ vars.META_START || '2025-01-01' }}
      META_REPROCESS_DAYS: '7'
    steps:
      - name: Marcar início
        run: echo "T0=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Buscar dados no Meta Ads
        run: node scripts/sync-meta.mjs
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      - name: Publicar dados
        if: always()
        run: |
          git config user.name "bi-digna-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && { echo "Sem mudanças nos dados"; exit 0; }
          git commit -m "Sincroniza Meta Ads $(date -u +%Y-%m-%dT%H:%MZ)"
          if ! git pull --rebase origin main; then
            git rebase --abort || true
            echo "::error::Outra sincronização gravou dados ao mesmo tempo. Nada foi perdido; a próxima rodada atualiza normalmente."
            exit 1
          fi
          git push origin HEAD:main
      - name: Agendar a próxima rodada (1 h após o início desta)
        # Corrente que não depende do agendador do GitHub. Para pausar, crie a variável META_AUTOLOOP=off.
        if: always() && vars.META_AUTOLOOP != 'off'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          WAIT=$(( 3600 - ($(date +%s) - T0) ))
          if [ "$WAIT" -gt 0 ]; then sleep "$WAIT"; fi
          OTHERS=$(gh run list -R "$GITHUB_REPOSITORY" -w sync-meta.yml -L 20 --json status,databaseId \
            --jq '[.[] | select(.status!="completed" and .databaseId != ${{ github.run_id }})] | length')
          if [ "$OTHERS" = "0" ]; then
            gh workflow run sync-meta.yml -R "$GITHUB_REPOSITORY" --ref main
            echo "Próxima rodada agendada."
          else
            echo "Já existe outra rodada na fila; nenhuma nova foi criada."
          fi
