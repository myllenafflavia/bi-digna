name: Sincronizar RD CRM

on:
  schedule:
    - cron: '7 * * * *'   # a cada hora, no minuto 7
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-rd
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # sempre a versão mais recente, mesmo ao reexecutar uma rodada antiga
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Buscar dados no RD Station CRM
        run: node scripts/sync-rd.mjs
        env:
          RD_CRM_TOKEN: ${{ secrets.RD_CRM_TOKEN }}
          RD_HASH_SALT: ${{ secrets.RD_HASH_SALT }}
      - name: Publicar dados
        if: always()
        run: |
          git config user.name "bi-digna-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && { echo "Sem mudanças nos dados"; exit 0; }
          git commit -m "Sincroniza RD CRM $(date -u +%Y-%m-%dT%H:%MZ)"
          if ! git pull --rebase origin main; then
            git rebase --abort || true
            echo "::error::Outra sincronização gravou dados ao mesmo tempo. Nada foi perdido; a próxima rodada atualiza normalmente."
            exit 1
          fi
          git push origin HEAD:main
