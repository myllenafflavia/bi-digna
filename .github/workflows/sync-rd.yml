name: Sincronizar RD CRM

on:
  schedule:
    # O agendador do GitHub atrasa ou pula rodadas; três tentativas por hora
    # mantêm os dados com no máximo cerca de uma hora de atraso.
    - cron: '3,23,43 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/sync-rd.mjs'
      - '.github/workflows/sync-rd.yml'

permissions:
  contents: write
  actions: write   # para a rodada agendar a próxima


jobs:
  sync:
    runs-on: ubuntu-latest
    concurrency:
      group: rd-sync   # uma coleta por vez; a espera da corrente fica fora da fila
      cancel-in-progress: false
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # sempre a versão mais recente, mesmo ao reexecutar uma rodada antiga
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Buscar dados no RD Station CRM
        run: node scripts/sync-rd.mjs
        env:
          RD_CRM_TOKEN: ${{ secrets.RD_CRM_TOKEN }}
          RD_HASH_SALT: ${{ secrets.RD_HASH_SALT }}
      - name: Publicar dados
        if: always()
        run: |
          git config user.name "bi-digna-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && { echo "Sem mudanças nos dados"; exit 0; }
          git commit -m "Sincroniza RD CRM $(date -u +%Y-%m-%dT%H:%MZ)"
          if ! git pull --rebase origin main; then
            git rebase --abort || true
            echo "::error::Outra sincronização gravou dados ao mesmo tempo. Nada foi perdido; a próxima rodada atualiza normalmente."
            exit 1
          fi
          git push origin HEAD:main

  agendar:
    # Corrente que não depende do agendador do GitHub: espera 20 minutos desde o início
    # desta rodada e dispara a próxima, a menos que já exista uma rodada mais nova.
    # Para pausar, crie a variável RD_AUTOLOOP=off.
    needs: sync
    if: always() && vars.RD_AUTOLOOP != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Esperar e agendar a próxima rodada
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          START=$(date -d "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/${{ github.run_id }} --jq .created_at)" +%s)
          WAIT=$(( 1200 - ($(date +%s) - START) ))
          if [ "$WAIT" -gt 0 ]; then sleep "$WAIT"; fi
          ME=$(gh api repos/$GITHUB_REPOSITORY/actions/runs/${{ github.run_id }} --jq .created_at)
          NEWER=$(gh run list -R "$GITHUB_REPOSITORY" -w sync-rd.yml -L 20 --json createdAt --jq "[.[] | select(.createdAt > \"$ME\")] | length")
          if [ "$NEWER" = "0" ]; then
            gh workflow run sync-rd.yml -R "$GITHUB_REPOSITORY" --ref main
            echo "Próxima rodada agendada."
          else
            echo "Já existe uma rodada mais nova; esta corrente termina aqui."
          fi
