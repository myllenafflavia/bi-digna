name: Sincronizar RD CRM

on:
  schedule:
    # O agendador do GitHub atrasa ou pula rodadas; três tentativas por hora
    # mantêm os dados com no máximo cerca de uma hora de atraso.
    - cron: '3,23,43 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/sync-rd.mjs'
      - '.github/workflows/sync-rd.yml'

permissions:
  contents: write
  actions: write   # para a rodada agendar a próxima

concurrency:
  group: sync-rd
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Marcar início
        run: echo "T0=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: main   # sempre a versão mais recente, mesmo ao reexecutar uma rodada antiga
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Buscar dados no RD Station CRM
        run: node scripts/sync-rd.mjs
        env:
          RD_CRM_TOKEN: ${{ secrets.RD_CRM_TOKEN }}
          RD_HASH_SALT: ${{ secrets.RD_HASH_SALT }}
      - name: Publicar dados
        if: always()
        run: |
          git config user.name "bi-digna-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && { echo "Sem mudanças nos dados"; exit 0; }
          git commit -m "Sincroniza RD CRM $(date -u +%Y-%m-%dT%H:%MZ)"
          if ! git pull --rebase origin main; then
            git rebase --abort || true
            echo "::error::Outra sincronização gravou dados ao mesmo tempo. Nada foi perdido; a próxima rodada atualiza normalmente."
            exit 1
          fi
          git push origin HEAD:main
      - name: Agendar a próxima rodada (20 min após o início desta)
        # O agendador do GitHub atrasa ou pula rodadas; esta corrente mantém a
        # atualização a cada 20 minutos. Para pausar, crie a variável RD_AUTOLOOP=off.
        if: always() && vars.RD_AUTOLOOP != 'off'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          WAIT=$(( 1200 - ($(date +%s) - T0) ))
          if [ "$WAIT" -gt 0 ]; then sleep "$WAIT"; fi
          OTHERS=$(gh run list -R "$GITHUB_REPOSITORY" -w sync-rd.yml -L 20 --json status,databaseId \
            --jq '[.[] | select(.status!="completed" and .databaseId != ${{ github.run_id }})] | length')
          if [ "$OTHERS" = "0" ]; then
            gh workflow run sync-rd.yml -R "$GITHUB_REPOSITORY" --ref main
            echo "Próxima rodada agendada."
          else
            echo "Já existe outra rodada na fila; nenhuma nova foi criada."
          fi
